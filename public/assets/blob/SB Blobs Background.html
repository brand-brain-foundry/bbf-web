<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SB_Blobs 2 — Background</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070f}
  #gl{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   SB_Blobs 2 — After Effects comp replicated as a WebGL2 multi-pass chain.

   AE source (comp 1920x1080):
     Layer "SB_Video - Blob 2"  : 4-Color Gradient (blue/black/black/navy)
                                  Gaussian Blur 12 · CC Radial Blur Fading
                                  Zoom, Amount 55.8, Center 1531.4,431.4
     Layer "Shape Layer 3"      : blob shapes + 4-Color Gradient
                                  (green/blue/blue/navy)
                                  Gaussian Blur 12 · CC Radial Blur Fading
                                  Zoom, Amount 81.0, Center 1531.4,431.4
     Layer "Adjustment Layer 1" : 4-Color Gradient (green/blue/blue/navy)
                                  Noise 14% (color noise, clipped)

   Pass chain here:
     1  base   : blob layer (SDF shapes x 4-color gradient) -> FBO A
     2  blur H : gaussian sigma 12 (comp px)                -> FBO B
     3  blur V : gaussian                                   -> FBO A
     4  final  : CC-style fading zoom blur + composite over the background
                 gradient + adjustment gradient grade + noise -> screen

   The background layer is evaluated analytically in the final pass: it is a
   pure 4-colour gradient with no shapes, so a 12px gaussian is a no-op on it
   and its radial blur only marginally shifts an already-smooth field.
   ───────────────────────────────────────────────────────────────────────── */

const CW = 1920, CH = 1080;             // AE comp size — all points live here
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false });

const VERT = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
  gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
}`;

/* Shared helpers: AE's 4-Color Gradient is an inverse-square distance weighted
   blend of four coloured points (Blend 100, Jitter 0).                      */
const COMMON = `
precision highp float;
uniform vec2 uComp;      // 1920,1080
uniform vec2 uRes;       // render target size in px
uniform float uTime;

vec2 toComp(vec2 frag){
  // map the render target to the comp, preserving 16:9 by cover-fitting
  vec2 uv = frag / uRes;
  float ta = uComp.x / uComp.y, ra = uRes.x / uRes.y;
  vec2 s = ra > ta ? vec2(1.0, ta/ra) : vec2(ra/ta, 1.0);
  uv = (uv - 0.5) / s + 0.5;
  return vec2(uv.x, 1.0 - uv.y) * uComp;
}
vec3 g4(vec2 q, vec2 p1, vec3 c1, vec2 p2, vec3 c2, vec2 p3, vec3 c3, vec2 p4, vec3 c4){
  vec2 d1=q-p1, d2=q-p2, d3=q-p3, d4=q-p4;
  float w1=1.0/(dot(d1,d1)+1.0);
  float w2=1.0/(dot(d2,d2)+1.0);
  float w3=1.0/(dot(d3,d3)+1.0);
  float w4=1.0/(dot(d4,d4)+1.0);
  float s=w1+w2+w3+w4;
  return (c1*w1 + c2*w2 + c3*w3 + c4*w4)/s;
}
float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
`;

/* ── Pass 1 · blob layer ────────────────────────────────────────────────── */
const FRAG_BASE = `#version 300 es
${COMMON}
out vec4 O;

// ellipse SDF in comp px (approximate, adequate for soft blobs)
float sdEllipse(vec2 q, vec2 c, vec2 r){
  vec2 d = (q - c) / r;
  return (length(d) - 1.0) * min(r.x, r.y);
}
float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}

void main(){
  vec2 q = toComp(gl_FragCoord.xy);
  float t = uTime;

  // Shape Layer 3 — four large lobes; the dark channels are the gaps between
  // them. Centres drift slowly so the background breathes.
  vec2 c1 = vec2( 330.0 + sin(t*0.42)*150.0 + sin(t*0.19)*80.0,   90.0 + cos(t*0.35)*115.0);
  vec2 c2 = vec2(1660.0 + cos(t*0.31)*165.0 + cos(t*0.17)*70.0,   60.0 + sin(t*0.46)*100.0);
  vec2 c3 = vec2( 840.0 + sin(t*0.27)*185.0 + sin(t*0.51)*70.0, 1110.0 + cos(t*0.38)*130.0);
  vec2 c4 = vec2(2030.0 + cos(t*0.49)*125.0,  330.0 + sin(t*0.23)*160.0 + sin(t*0.41)*60.0);

  // radii breathe too, so the lobes swell and shrink as they drift
  float br = 1.0 + 0.10 * sin(t * 0.33);
  float br2 = 1.0 + 0.10 * cos(t * 0.44);

  float d = sdEllipse(q, c1, vec2(610.0, 430.0) * br);
  d = smin(d, sdEllipse(q, c2, vec2(505.0, 365.0) * br2), 55.0);
  d = smin(d, sdEllipse(q, c3, vec2(600.0, 420.0) * br2), 55.0);
  d = smin(d, sdEllipse(q, c4, vec2(360.0, 330.0) * br), 85.0);

  // soft edge, but tight enough that the lobe boundaries still read as forms
  float a = smoothstep(60.0, -120.0, d);

  vec3 col = g4(q,
    vec2(1059.9,  40.0), vec3(0.208, 0.871, 0.549),   // Color 1 · green
    vec2(1850.1,  95.5), vec3(0.118, 0.310, 0.784),   // Color 2 · blue
    vec2(1498.3, 479.8), vec3(0.086, 0.337, 0.941),   // Color 3 · blue
    vec2(1875.5, 774.2), vec3(0.078, 0.153, 0.369));  // Color 4 · navy

  O = vec4(col * a, a);   // premultiplied, so blurs stay halo-free
}`;

/* ── Pass 2/3 · separable gaussian (AE Blurriness 12, repeat edge pixels) ── */
const FRAG_BLUR = `#version 300 es
${COMMON}
uniform sampler2D uTex;
uniform vec2 uDir;       // (1,0) or (0,1)
uniform float uSigma;    // in render-target px
out vec4 O;

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 texel = 1.0 / uRes;
  vec4 sum = texture(uTex, uv);
  float wsum = 1.0;
  // 8 linear-sampled taps per side
  for(int i=1;i<=8;i++){
    float o = float(i) * 1.5;
    float w = exp(-0.5 * (o*o) / (uSigma*uSigma));
    vec2 off = uDir * texel * o * uSigma * 0.5;
    sum += texture(uTex, uv + off) * w;
    sum += texture(uTex, uv - off) * w;
    wsum += 2.0 * w;
  }
  O = sum / wsum;
}`;

/* ── Pass 4 · CC Radial Blur (Fading Zoom) + composite + grade + noise ──── */
const FRAG_FINAL = `#version 300 es
${COMMON}
uniform sampler2D uTex;
uniform vec2 uBlurCenter;   // comp px
uniform float uAmount;      // normalised zoom reach
out vec4 O;

float hash(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = frag / uRes;
  vec2 q = toComp(frag);

  // centre of the zoom, expressed in this target's uv space
  vec2 cuv;
  {
    vec2 n = uBlurCenter / uComp;              // 0..1 in comp space
    n = vec2(n.x, 1.0 - n.y);
    float ta = uComp.x/uComp.y, ra = uRes.x/uRes.y;
    vec2 s = ra > ta ? vec2(1.0, ta/ra) : vec2(ra/ta, 1.0);
    cuv = (n - 0.5) * s + 0.5;
  }

  // Fading Zoom: samples march back toward the centre, their weight fading
  // with distance travelled -> streaks that dissolve outward.
  const int TAPS = 28;
  vec4 acc = vec4(0.0);
  float wsum = 0.0;
  for(int i=0;i<TAPS;i++){
    float t = float(i) / float(TAPS-1);
    float scale = 1.0 - t * uAmount;
    vec2 suv = cuv + (uv - cuv) * scale;
    float w = 1.0 - t * 0.86;                  // the "fading" part
    acc += texture(uTex, suv) * w;
    wsum += w;
  }
  vec4 blob = acc / wsum;

  // ── Layer "Blob 2": background 4-colour gradient (blue / black / navy) ──
  vec3 bg = g4(q,
    vec2( 872.2, -43.8), vec3(0.118, 0.310, 0.784),   // Color 1 · blue
    vec2(1850.1,  95.5), vec3(0.000, 0.000, 0.000),   // Color 2 · black
    vec2(1498.3, 479.8), vec3(0.000, 0.000, 0.000),   // Color 3 · black
    vec2(1532.8, 907.5), vec3(0.043, 0.075, 0.220));  // Color 4 · navy

  vec3 col = bg * (1.0 - blob.a) + blob.rgb;          // premultiplied over

  // ── Adjustment Layer 1: 4-colour gradient, applied as a colour grade ────
  vec3 adj = g4(q,
    vec2( 856.0,   4.6), vec3(0.302, 0.933, 0.608),   // Color 1 · green
    vec2(1894.1,  63.3), vec3(0.165, 0.353, 0.816),   // Color 2 · blue
    vec2( 595.7, 809.2), vec3(0.102, 0.353, 0.941),   // Color 3 · blue
    vec2(1441.6, 995.9), vec3(0.118, 0.227, 0.471));  // Color 4 · navy

  float lb = luma(col), la = max(luma(adj), 0.001);
  vec3 graded = clamp(adj * (lb / la), 0.0, 1.0);
  col = mix(col, graded, 0.62);

  // ── Noise 14%, colour noise, clip result values ────────────────────────
  float tq = floor(uTime * 12.0);
  vec3 n = vec3(
    hash(vec3(frag, tq)),
    hash(vec3(frag + 137.31, tq + 57.0)),
    hash(vec3(frag + 311.7, tq + 113.0)));
  col = clamp(col + (n - 0.5) * 0.14, 0.0, 1.0);

  O = vec4(col, 1.0);
}`;

/* ── boilerplate ────────────────────────────────────────────────────────── */
function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src);
  return s;
}
function prog(fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const pBase = prog(FRAG_BASE), pBlur = prog(FRAG_BLUR), pFinal = prog(FRAG_FINAL);
const vao = gl.createVertexArray();

function makeTarget(){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  return { tex, fbo, w:0, h:0 };
}
const A = makeTarget(), B = makeTarget();
function sizeTarget(t, w, h){
  if(t.w === w && t.h === h) return;
  t.w = w; t.h = h;
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
}

// everything downstream is heavily blurred, so render the blob chain at half res
const SCALE = 0.5;
let W = 0, H = 0, bw = 0, bh = 0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  W = Math.round(window.innerWidth * dpr);
  H = Math.round(window.innerHeight * dpr);
  canvas.width = W; canvas.height = H;
  bw = Math.max(2, Math.round(W * SCALE));
  bh = Math.max(2, Math.round(H * SCALE));
  sizeTarget(A, bw, bh); sizeTarget(B, bw, bh);
}
window.addEventListener('resize', resize);
resize();

function setCommon(p, w, h, time){
  gl.uniform2f(gl.getUniformLocation(p, 'uComp'), CW, CH);
  gl.uniform2f(gl.getUniformLocation(p, 'uRes'), w, h);
  gl.uniform1f(gl.getUniformLocation(p, 'uTime'), time);
}

const t0 = performance.now();
function frame(){
  requestAnimationFrame(frame);
  const time = (performance.now() - t0) / 1000;
  gl.bindVertexArray(vao);

  // 1 · blob layer
  gl.bindFramebuffer(gl.FRAMEBUFFER, A.fbo);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(pBase);
  setCommon(pBase, bw, bh, time);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2/3 · gaussian 12 (comp px) -> render-target px
  const sigma = Math.max(1.0, 12.0 * (bw / CW));
  const blurPass = (src, dst, dx, dy) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, bw, bh);
    gl.useProgram(pBlur);
    setCommon(pBlur, bw, bh, time);
    gl.uniform2f(gl.getUniformLocation(pBlur, 'uDir'), dx, dy);
    gl.uniform1f(gl.getUniformLocation(pBlur, 'uSigma'), sigma);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(gl.getUniformLocation(pBlur, 'uTex'), 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  blurPass(A, B, 1, 0);
  blurPass(B, A, 0, 1);

  // 4 · fading zoom + composite + grade + noise
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(pFinal);
  setCommon(pFinal, W, H, time);
  gl.uniform2f(gl.getUniformLocation(pFinal, 'uBlurCenter'), 1531.4, 431.4);
  gl.uniform1f(gl.getUniformLocation(pFinal, 'uAmount'), 0.105); // AE Amount 81
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, A.tex);
  gl.uniform1i(gl.getUniformLocation(pFinal, 'uTex'), 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
frame();
</script>
</body>
